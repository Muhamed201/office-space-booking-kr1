spring:
  application:
    name: office-booking-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:55432/office_booking}
    username: ${SPRING_DATASOURCE_USERNAME:office}
    password: ${SPRING_DATASOURCE_PASSWORD}
  flyway:
    locations: classpath:db/migration,classpath:db/common
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 32
  data:
    web:
      pageable:
        max-page-size: 100
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

server:
  port: ${APP_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    secret-base64: ${JWT_SECRET_BASE64}
    issuer: ${JWT_ISSUER:office-booking}
    access-minutes: ${ACCESS_TOKEN_MINUTES:15}
    refresh-days: ${REFRESH_TOKEN_DAYS:14}
  bootstrap:
    email: ${BOOTSTRAP_ADMIN_EMAIL:admin@example.org}
    name: ${BOOTSTRAP_ADMIN_NAME:System Administrator}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  security:
    permanent-delete-enabled: ${PERMANENT_DELETE_ENABLED:false}
    max-login-attempts: ${MAX_LOGIN_ATTEMPTS:5}
    lockout-minutes: ${LOCKOUT_MINUTES:15}
